<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>App Financiera</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans pb-20 overflow-x-hidden">

  <!-- ================= PANTALLA DE AUTENTICACIÓN ================= -->
  <div id="auth-screen" class="fixed inset-0 z-[100] bg-slate-900 flex flex-col justify-center items-center p-6">
    <div class="bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl w-full max-w-sm">
      <h1 class="text-3xl font-black text-center text-blue-400 mb-2">SOLTECH</h1>
      <p class="text-center text-slate-400 text-sm mb-6">Gestión Empresarial</p>
      <input type="email" id="auth-email" placeholder="Correo electrónico" class="w-full bg-slate-700 p-3 rounded-lg mb-3 text-white outline-none focus:border-blue-500 border border-transparent">
      <input type="password" id="auth-pass" placeholder="Contraseña" class="w-full bg-slate-700 p-3 rounded-lg mb-6 text-white outline-none focus:border-blue-500 border border-transparent">
      <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg mb-3 transition shadow-lg">Iniciar Sesión</button>
      <button onclick="register()" class="w-full bg-slate-700 hover:bg-slate-600 text-blue-400 font-bold py-3 rounded-lg transition border border-slate-600">Crear Cuenta</button>
    </div>
  </div>

  <header class="p-4 bg-slate-800 border-b border-slate-700 sticky top-0 z-10 flex justify-between items-center shadow-md">
    <h1 class="font-bold text-lg text-blue-400">Control Financiero</h1>
    <button onclick="logout()" class="text-xs bg-rose-600 hover:bg-rose-500 px-3 py-1.5 rounded-lg font-bold shadow">Cerrar Sesión</button>
  </header>

  <main class="p-4 max-w-lg mx-auto relative hidden" id="main-app">
    
    <!-- ================= INICIO ================= -->
    <section id="view-inicio" class="vista-seccion space-y-5">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xs font-bold text-slate-400 uppercase">Resumen del Día</h2>
          <input type="date" id="filtro-inicio" onchange="actualizarDashboard()" class="bg-slate-700 text-xs p-1.5 rounded text-white border border-slate-600 outline-none focus:border-blue-500">
        </div>
        <div class="grid grid-cols-2 gap-3 mb-4">
          <div class="bg-emerald-950/40 p-3 rounded-lg border border-emerald-800/50 shadow-inner">
            <p class="text-xs text-emerald-400">Entradas</p>
            <p id="inicio-ingresos" class="text-xl font-bold text-emerald-300">0</p>
          </div>
          <div class="bg-rose-950/40 p-3 rounded-lg border border-rose-800/50 shadow-inner">
            <p class="text-xs text-rose-400">Salidas</p>
            <p id="inicio-egresos" class="text-xl font-bold text-rose-300">0</p>
          </div>
        </div>
        <div class="flex justify-between items-center pt-2 border-t border-slate-700"><span class="font-bold text-sm">Flujo Neto:</span><span id="inicio-neto" class="text-lg font-bold text-blue-400">0</span></div>
      </div>

      <section class="grid grid-cols-2 gap-3">
        <button onclick="prepararFormulario('venta-prod')" class="bg-blue-600 p-4 rounded-xl font-bold text-sm shadow-lg flex flex-col items-center col-span-2 hover:bg-blue-500 transition">📦 Registrar Venta Producto</button>
        <button onclick="prepararFormulario('venta-libre')" class="bg-cyan-600 p-3 rounded-xl font-bold text-sm shadow-lg flex flex-col items-center hover:bg-cyan-500 transition">⚡ Venta Libre</button>
        <button onclick="prepararFormulario('gasto')" class="bg-rose-600 p-3 rounded-xl font-bold text-sm shadow-lg flex flex-col items-center hover:bg-rose-500 transition">💸 Registrar Gasto</button>
      </section>
      
      <section class="grid grid-cols-2 gap-3 border-t border-slate-700 pt-4">
        <button onclick="cambiarVista('clientes')" class="bg-slate-800 p-3 rounded-xl border border-slate-600 font-bold text-sm flex justify-center items-center gap-2 hover:bg-slate-700 transition">👥 Clientes</button>
        <button onclick="cambiarVista('proveedores')" class="bg-slate-800 p-3 rounded-xl border border-slate-600 font-bold text-sm flex justify-center items-center gap-2 hover:bg-slate-700 transition">🏢 Proveedores</button>
      </section>
    </section>

    <!-- ================= CAJA / BALANCE DETALLADO ================= -->
    <section id="view-balance" class="vista-seccion space-y-4 hidden">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-xs font-bold text-slate-400 uppercase">Flujo de Caja Real</h2>
          <button onclick="limpiarFiltroCaja()" class="text-[10px] bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded text-slate-300 shadow">Ver Todo</button>
        </div>
        
        <!-- Doble Filtro: Fecha y Tipo de Movimiento -->
        <div class="grid grid-cols-2 gap-2">
          <input type="date" id="filtro-balance" onchange="cargarBalance()" class="w-full bg-slate-700 text-xs p-2 rounded text-white border border-slate-600 outline-none focus:border-blue-500">
          <select id="filtro-tipo-caja" onchange="cargarBalance()" class="w-full bg-slate-700 text-xs p-2 rounded text-white border border-slate-600 outline-none focus:border-blue-500">
            <option value="todos">Todos los tipos</option>
            <option value="ENTRADA">Solo Entradas</option>
            <option value="SALIDA">Solo Salidas</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3 pt-1">
          <div class="bg-emerald-950/40 p-2.5 rounded-lg border border-emerald-800/50">
            <p class="text-[10px] text-emerald-400">Entradas (<span id="bal-count-in">0</span>)</p>
            <p id="bal-ingresos" class="text-lg font-bold text-emerald-300">0</p>
          </div>
          <div class="bg-rose-950/40 p-2.5 rounded-lg border border-rose-800/50">
            <p class="text-[10px] text-rose-400">Salidas (<span id="bal-count-out">0</span>)</p>
            <p id="bal-egresos" class="text-lg font-bold text-rose-300">0</p>
          </div>
        </div>
        <div class="flex justify-between items-center pt-2 border-t border-slate-700 text-xs">
          <span class="font-bold">Neto en Caja:</span>
          <span id="bal-neto" class="text-base font-bold text-blue-400">0</span>
        </div>
      </div>

      <!-- Historial Filtrado de Movimientos -->
      <div id="lista-caja-movimientos" class="space-y-2"></div>
    </section>

    <!-- ================= DEUDAS AGRUPADAS ================= -->
    <section id="view-deudas" class="vista-seccion space-y-4 hidden">
      <div class="flex gap-2">
        <button onclick="cambiarPestanaDeudas('cobrar')" id="btn-cobrar" class="flex-1 py-2 rounded-lg font-bold text-sm bg-amber-600 text-white shadow-lg transition-all">Por Cobrar</button>
        <button onclick="cambiarPestanaDeudas('pagar')" id="btn-pagar" class="flex-1 py-2 rounded-lg font-bold text-sm bg-slate-800 border border-slate-600 text-slate-400 transition-all">Por Pagar</button>
      </div>
      <div id="lista-deudas-cobrar" class="space-y-4"></div>
      <div id="lista-deudas-pagar" class="space-y-4 hidden"></div>
    </section>

    <!-- ================= DIRECTORIOS ================= -->
    <section id="view-clientes" class="vista-seccion space-y-4 hidden"><div class="flex justify-between items-center"><h2 class="font-bold text-emerald-400">Clientes</h2><button onclick="prepararFormulario('cliente')" class="bg-emerald-600 px-3 py-1 rounded text-sm shadow">+ Nuevo</button></div><div id="lista-clientes" class="space-y-3"></div></section>
    <section id="view-proveedores" class="vista-seccion space-y-4 hidden"><div class="flex justify-between items-center"><h2 class="font-bold text-purple-400">Proveedores</h2><button onclick="prepararFormulario('proveedor')" class="bg-purple-600 px-3 py-1 rounded text-sm shadow">+ Nuevo</button></div><div id="lista-proveedores" class="space-y-3"></div></section>
    <section id="view-inventario" class="vista-seccion space-y-4 hidden"><div class="flex justify-between items-center"><h2 class="font-bold text-amber-400">Inventario</h2><button onclick="prepararFormulario('producto')" class="bg-amber-600 px-3 py-1 rounded text-sm shadow">+ Nuevo</button></div><div id="lista-inventario" class="space-y-3"></div></section>

    <!-- ================= MODALES FORMULARIOS ================= -->
    <div id="form-container" class="hidden fixed inset-0 z-50 bg-slate-900/95 flex justify-center items-center p-4">
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-600 shadow-2xl w-full max-w-sm relative max-h-[90vh] overflow-y-auto">
        <button onclick="ocultarForm()" class="absolute top-3 right-4 text-xl text-slate-400 hover:text-white">&times;</button>
        
        <!-- VENTA PRODUCTO -->
        <form id="form-venta-prod" class="space-y-3 hidden"><h3 class="font-bold text-blue-400">Vender Producto</h3>
          <input type="datetime-local" id="vp-fecha" class="w-full bg-slate-700 p-2 rounded text-sm text-white focus:border-blue-500">
          <select id="vp-cliente" class="w-full bg-slate-700 p-2 rounded text-sm text-white"><option value="">Cliente (Opcional al contado)</option></select>
          <select id="vp-producto" class="w-full bg-slate-700 p-2 rounded text-sm text-white"></select>
          <div class="grid grid-cols-2 gap-2">
            <div><label class="text-xs text-slate-400">Cant.</label><input type="number" inputmode="decimal" pattern="[0-9]*" id="vp-cantidad" value="1" class="w-full bg-slate-700 p-2 rounded text-sm text-white outline-none"></div>
            <div><label class="text-xs text-slate-400">Precio Und.</label><input type="number" inputmode="decimal" pattern="[0-9]*" id="vp-precio" class="w-full bg-slate-700 p-2 rounded text-sm text-white outline-none"></div>
          </div>
          <div class="flex gap-2 items-center"><input type="checkbox" id="vp-es-deuda" onchange="toggleAbono('vp')"><label class="text-sm">¿A Crédito?</label></div>
          <input type="number" inputmode="decimal" pattern="[0-9]*" id="vp-abono" placeholder="Abono Inicial (Si aplica)" class="w-full bg-slate-700 p-2 rounded text-sm text-white outline-none hidden">
          <button type="button" onclick="guardarVentaProducto()" class="w-full bg-blue-600 py-2 rounded font-bold shadow-lg">Vender</button>
        </form>

        <!-- VENTA LIBRE -->
        <form id="form-venta-libre" class="space-y-3 hidden"><h3 class="font-bold text-cyan-400">Venta Libre</h3>
          <input type="datetime-local" id="vl-fecha" class="w-full bg-slate-700 p-2 rounded text-sm text-white focus:border-cyan-500">
          <select id="vl-cliente" class="w-full bg-slate-700 p-2 rounded text-sm text-white"><option value="">Cliente (Opcional al contado)</option></select>
          <input type="number" inputmode="decimal" pattern="[0-9]*" id="vl-valor" placeholder="Monto Total" class="w-full bg-slate-700 p-2 rounded text-sm text-white outline-none">
          <div class="flex gap-2 items-center"><input type="checkbox" id="vl-es-deuda" onchange="toggleAbono('vl')"><label class="text-sm">¿A Crédito?</label></div>
          <input type="number" inputmode="decimal" pattern="[0-9]*" id="vl-abono" placeholder="Abono Inicial (Si aplica)" class="w-full bg-slate-700 p-2 rounded text-sm text-white outline-none hidden">
          <input type="text" id="vl-detalles" placeholder="Concepto..." class="w-full bg-slate-700 p-2 rounded text-sm text-white outline-none">
          <button type="button" onclick="guardarVentaLibre()" class="w-full bg-cyan-600 py-2 rounded font-bold shadow-lg">Guardar Venta</button>
        </form>

        <!-- GASTO -->
        <form id="form-gasto" class="space-y-3 hidden"><h3 class="font-bold text-rose-400">Registrar Gasto o Compra</h3>
          <input type="datetime-local" id="g-fecha" class="w-full bg-slate-700 p-2 rounded text-sm text-white focus:border-rose-500">
          <select id="g-proveedor" class="w-full bg-slate-700 p-2 rounded text-sm text-white"></select>
          
          <div class="p-2 border border-slate-700 rounded bg-slate-800">
            <label class="text-xs text-amber-400 font-bold block mb-1">Sumar al Inventario (Opcional)</label>
            <select id="g-producto" class="w-full bg-slate-700 p-2 rounded text-sm text-white mb-2"><option value="">-- No aplica --</option></select>
            <div class="grid grid-cols-2 gap-2">
              <div><label class="text-xs text-slate-400">Cantidad</label><input type="number" inputmode="decimal" pattern="[0-9]*" id="g-cantidad" class="w-full bg-slate-700 p-2 rounded text-sm text-white outline-none"></div>
              <div><label class="text-xs text-slate-400">Total Compra</label><input type="number" inputmode="decimal" pattern="[0-9]*" id="g-valor" class="w-full bg-slate-700 p-2 rounded text-sm text-white font-bold text-amber-300 outline-none"></div>
            </div>
          </div>
          
          <div class="flex gap-2 items-center mt-3"><input type="checkbox" id="g-es-deuda" onchange="toggleAbono('g')"><label class="text-sm">¿Queda debiendo?</label></div>
          <input type="number" inputmode="decimal" pattern="[0-9]*" id="g-abono" placeholder="Abono Realizado" class="w-full bg-slate-700 p-2 rounded text-sm text-white outline-none hidden">
          <input type="text" id="g-detalles" placeholder="Detalles..." class="w-full bg-slate-700 p-2 rounded text-sm text-white outline-none mt-2">
          <button type="button" onclick="guardarGasto()" class="w-full bg-rose-600 py-2 rounded font-bold mt-3 shadow-lg">Guardar Gasto</button>
        </form>
        
        <!-- EDICIÓN Y CREACIÓN -->
        <form id="form-producto" class="space-y-3 hidden"><h3 id="p-titulo" class="font-bold text-amber-400">Producto</h3><input type="hidden" id="p-id"><input type="text" id="p-nombre" placeholder="Nombre" class="w-full bg-slate-700 p-2 rounded text-sm text-white outline-none"><div class="grid grid-cols-2 gap-2"><input type="number" inputmode="decimal" pattern="[0-9]*" id="p-compra" placeholder="P. Compra" class="bg-slate-700 p-2 rounded text-sm text-white outline-none"><input type="number" inputmode="decimal" pattern="[0-9]*" id="p-venta" placeholder="P. Venta" class="bg-slate-700 p-2 rounded text-sm text-white outline-none"></div><input type="number" inputmode="decimal" pattern="[0-9]*" id="p-stock" placeholder="Cantidad Inicial" class="w-full bg-slate-700 p-2 rounded text-sm text-white outline-none"><div><label class="text-xs text-slate-400">Imagen (Opcional)</label><input type="file" id="p-imagen" accept="image/*" class="w-full text-xs text-slate-300"></div><button type="button" onclick="guardarProducto()" class="w-full bg-amber-600 py-2 rounded font-bold shadow-lg">Guardar</button></form>
        <form id="form-cliente" class="space-y-3 hidden"><h3 id="c-titulo" class="font-bold text-emerald-400">Cliente</h3><input type="hidden" id="c-id"><input type="text" id="c-nombre" placeholder="Nombre" class="w-full bg-slate-700 p-2 rounded text-sm text-white outline-none"><input type="tel" id="c-telefono" placeholder="Teléfono" class="w-full bg-slate-700 p-2 rounded text-sm text-white outline-none"><button type="button" onclick="guardarCliente()" class="w-full bg-emerald-600 py-2 rounded font-bold shadow-lg">Guardar</button></form>
        <form id="form-proveedor" class="space-y-3 hidden"><h3 id="prov-titulo" class="font-bold text-purple-400">Proveedor</h3><input type="hidden" id="prov-id"><input type="text" id="prov-nombre" placeholder="Nombre" class="w-full bg-slate-700 p-2 rounded text-sm text-white outline-none"><input type="tel" id="prov-telefono" placeholder="Teléfono" class="w-full bg-slate-700 p-2 rounded text-sm text-white outline-none"><button type="button" onclick="guardarProveedor()" class="w-full bg-purple-600 py-2 rounded font-bold shadow-lg">Guardar</button></form>
      </div>
    </div>
  </main>

  <!-- Navegación Inferior -->
  <nav class="fixed bottom-0 w-full bg-slate-800 border-t border-slate-700 flex justify-around p-2 pb-6 text-xs shadow-2xl z-10 hidden" id="main-nav">
    <button onclick="cambiarVista('inicio')" id="nav-inicio" class="nav-btn text-blue-400 flex flex-col items-center gap-1 transition-colors"><span class="text-lg">📊</span><span>Inicio</span></button>
    <button onclick="cambiarVista('inventario')" id="nav-inventario" class="nav-btn text-slate-400 flex flex-col items-center gap-1 transition-colors"><span class="text-lg">📦</span><span>Inventario</span></button>
    <button onclick="cambiarVista('balance')" id="nav-balance" class="nav-btn text-slate-400 flex flex-col items-center gap-1 transition-colors"><span class="text-lg">💰</span><span>Caja</span></button>
    <button onclick="cambiarVista('deudas')" id="nav-deudas" class="nav-btn text-slate-400 flex flex-col items-center gap-1 transition-colors"><span class="text-lg">💳</span><span>Deudas</span></button>
  </nav>

  <script>
    // 1. CREDENCIALES SUPABASE
    const { createClient } = supabase;
    const supabaseUrl = 'https://jmidlrztyzzmauroxuuf.supabase.co'; 
    const supabaseKey = 'sb_publishable_7rrvQ2yvzVaiYLEqtgoa_w_GbrCRoAi';
    const db = createClient(supabaseUrl, supabaseKey);

    const fmtMoneda = (v) => new Intl.NumberFormat('es-CO').format(v || 0);
    const gFecha = (fUTC) => { const d = new Date(fUTC); return new Date(d.getTime() - (d.getTimezoneOffset()*60000)).toISOString().split('T')[0]; };

    // 2. AUTENTICACIÓN
    async function checkSession() {
      const { data: { session } } = await db.auth.getSession();
      if (session) {
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('main-app').classList.remove('hidden');
        document.getElementById('main-nav').classList.remove('hidden');
        iniciarApp();
      } else {
        document.getElementById('auth-screen').classList.remove('hidden');
        document.getElementById('main-app').classList.add('hidden');
        document.getElementById('main-nav').classList.add('hidden');
      }
    }
    
    async function login() {
      const e = document.getElementById('auth-email').value; const p = document.getElementById('auth-pass').value;
      if(!e || !p) return alert('Por favor ingresa tu correo y contraseña.');
      const { error } = await db.auth.signInWithPassword({ email: e, password: p });
      if(error) alert('Error: ' + error.message); else checkSession();
    }
    
    async function register() {
      const e = document.getElementById('auth-email').value; const p = document.getElementById('auth-pass').value;
      if(!e || !p) return alert('Por favor ingresa tu correo y contraseña.');
      if(p.length < 6) return alert('La contraseña debe tener al menos 6 caracteres.');
      const { error } = await db.auth.signUp({ email: e, password: p });
      if(error) alert('Error: ' + error.message); else alert('Registro exitoso. Revisa tu correo o inicia sesión.');
    }
    
    async function logout() { await db.auth.signOut(); checkSession(); }
    window.onload = checkSession;

    // 3. NAVEGACIÓN Y CONFIGURACIÓN INICIAL
    function iniciarApp() {
      const hoy = new Date().toISOString().split('T')[0];
      document.getElementById('filtro-inicio').value = hoy;
      document.getElementById('filtro-balance').value = hoy;
      cargarDropdowns(); cambiarVista('inicio');
    }

    function cambiarVista(vista) {
      document.querySelectorAll('.vista-seccion').forEach(el => el.classList.add('hidden'));
      document.getElementById(`view-${vista}`).classList.remove('hidden');
      document.querySelectorAll('.nav-btn').forEach(btn => { btn.classList.replace('text-blue-400', 'text-slate-400'); });
      if(document.getElementById(`nav-${vista}`)) document.getElementById(`nav-${vista}`).classList.replace('text-slate-400', 'text-blue-400');
      
      if(vista === 'inicio') actualizarDashboard();
      if(vista === 'balance') cargarBalance();
      if(vista === 'deudas') { cargarDeudas(); cambiarPestanaDeudas('cobrar'); }
      if(vista === 'inventario') cargarInventario();
      if(vista === 'clientes') cargarListaClientes();
      if(vista === 'proveedores') cargarListaProveedores();
    }

    // 4. LÓGICA DE BALANCE Y CAJA (CON CONTEO DE TRANSACCIONES)
    async function procesarFlujoCaja(filtroFecha) {
      const { data: vts } = await db.from('ventas').select('*, clientes(nombre)');
      const { data: gts } = await db.from('gastos').select('*, proveedores(nombre)');
      const { data: abs } = await db.from('pagos_abonos').select('*');

      let inTotal = 0; let outTotal = 0; let countIn = 0; let countOut = 0; let movimientos = [];

      vts?.forEach(v => {
        const fechaStr = gFecha(v.fecha);
        if(!filtroFecha || fechaStr === filtroFecha) {
          const efectivo = v.es_deuda ? Number(v.abono) : Number(v.monto_final);
          if(efectivo > 0) {
            inTotal += efectivo;
            countIn++;
            movimientos.push({
              id: v.id, tabla: 'ventas', fecha: v.fecha, tipo: 'ENTRADA',
              titulo: v.clientes?.nombre || 'Venta Libre', sub: 'Venta / Abono Inicial', monto: efectivo
            });
          }
        }
      });

      abs?.forEach(a => {
        const fechaStr = gFecha(a.fecha);
        if(!filtroFecha || fechaStr === filtroFecha) {
          if(a.tipo === 'COBRO_VENTA') {
            inTotal += Number(a.monto);
            countIn++;
            movimientos.push({
              id: a.id, tabla: 'pagos_abonos', fecha: a.fecha, tipo: 'ENTRADA',
              titulo: 'Pago a Deuda Recibido', sub: 'Abono de Cliente', monto: Number(a.monto)
            });
          } else {
            outTotal += Number(a.monto);
            countOut++;
            movimientos.push({
              id: a.id, tabla: 'pagos_abonos', fecha: a.fecha, tipo: 'SALIDA',
              titulo: 'Abono a Proveedor Pagado', sub: 'Pago de Deuda', monto: Number(a.monto)
            });
          }
        }
      });

      gts?.forEach(g => {
        const fechaStr = gFecha(g.fecha);
        if(!filtroFecha || fechaStr === filtroFecha) {
          const efectivo = g.es_deuda ? Number(g.abono) : Number(g.valor);
          if(efectivo > 0) {
            outTotal += efectivo;
            countOut++;
            movimientos.push({
              id: g.id, tabla: 'gastos', fecha: g.fecha, tipo: 'SALIDA',
              titulo: g.proveedores?.nombre || 'Gasto General', sub: 'Gasto / Abono Inicial', monto: efectivo
            });
          }
        }
      });

      movimientos.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

      return { inTotal, outTotal, countIn, countOut, movimientos };
    }

    async function actualizarDashboard() {

    async function pagarDeuda(tabla, id, maxMonto) {
      const p = prompt(`Ingrese valor a abonar (Máx: $${fmtMoneda(maxMonto)}):`);
      if(!p || isNaN(p) || Number(p) <= 0) return;
      const monto = Math.min(Number(p), maxMonto);

      const payload = { monto, tipo: tabla==='ventas' ? 'COBRO_VENTA' : 'PAGO_GASTO' };
      if(tabla==='ventas') payload.venta_id = id; else payload.gasto_id = id;
      await db.from('pagos_abonos').insert([payload]);

      const { data } = await db.from(tabla).select('abono').eq('id', id).single();
      await db.from(tabla).update({ abono: Number(data.abono) + monto }).eq('id', id);

      cargarDeudas(); cargarBalance(); actualizarDashboard(); alert('Abono registrado con éxito');
    }

    async function pagarDeudaGeneral(tabla, idEntidad, nombreEntidad, maxMonto) {
      if(idEntidad === 'null') return alert('Usa el abono individual para registros sin entidad vinculada.');
      const p = prompt(`Abono a ${nombreEntidad} (Deuda: $${fmtMoneda(maxMonto)}):\nValor a abonar:`);
      if(!p || isNaN(p) || Number(p) <= 0) return;
      let montoRestante = Math.min(Number(p), maxMonto);

      const col = tabla === 'ventas' ? 'cliente_id' : 'proveedor_id';
      const { data: deudas } = await db.from(tabla).select('*').eq(col, idEntidad).gt('saldo_pendiente', 0).order('fecha', {ascending: true});

      for(let d of deudas) {
        if(montoRestante <= 0) break;
        const aAbonar = Math.min(montoRestante, Number(d.saldo_pendiente));
        montoRestante -= aAbonar;

        const payload = { monto: aAbonar, tipo: tabla==='ventas' ? 'COBRO_VENTA' : 'PAGO_GASTO' };
        if(tabla==='ventas') payload.venta_id = d.id; else payload.gasto_id = d.id;
        await db.from('pagos_abonos').insert([payload]);
        await db.from(tabla).update({ abono: Number(d.abono) + aAbonar }).eq('id', d.id);
      }
      cargarDeudas(); cargarBalance(); actualizarDashboard(); alert('Abono distribuido correctamente.');
    }

      const fInp = document.getElementById('vp-fecha').value;

      const producto_id = document.getElementById('vp-producto').value;
      const cant = Number(document.getElementById('vp-cantidad').value);

      const mBruto = cant * precioUnd;
      const es_deuda = document.getElementById('vp-es-deuda').checked;
      const abono = Number(document.getElementById('vp-abono').value||0);
      
      if (es_deuda && !cliente_id) return alert('Para una venta a crédito debes seleccionar un cliente.');

      const prod = window.listaProductos.find(x => x.id === producto_id);
      await db.from('productos').update({ cantidad_disponible: Number(prod.cantidad_disponible) - cant }).eq('id', producto_id);

      const payload = { tipo_venta: 'PRODUCTO', cliente_id: cliente_id || null, producto_id, cantidad: cant, monto_bruto: mBruto, descuento: 0, es_deuda, abono: es_deuda?abono:0 };
