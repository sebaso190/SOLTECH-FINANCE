<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Control Financiero</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 pb-20 font-sans">

  <header class="p-4 bg-slate-800 border-b border-slate-700 sticky top-0 z-10 flex justify-between items-center">
    <h1 class="font-bold text-lg text-blue-400">Control Financiero</h1>
    <span id="pwa-status" class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded-full">PWA Lista</span>
  </header>

  <main class="p-4 space-y-6 max-w-lg mx-auto">

    <section class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
      <h2 class="text-xs uppercase font-semibold text-slate-400 mb-3">Resumen Financiero</h2>
      <div class="grid grid-cols-2 gap-3 mb-4">
        <div class="bg-emerald-950/40 p-3 rounded-lg border border-emerald-800/50">
          <p class="text-xs text-emerald-400">Ingresos Totales</p>
          <p id="total-ingresos" class="text-xl font-bold text-emerald-300">$0.00</p>
        </div>
        <div class="bg-rose-950/40 p-3 rounded-lg border border-rose-800/50">
          <p class="text-xs text-rose-400">Egresos Totales</p>
          <p id="total-egresos" class="text-xl font-bold text-rose-300">$0.00</p>
        </div>
      </div>
      <div class="pt-2 border-t border-slate-700 flex justify-between items-center">
        <span class="text-sm font-medium">Balance Neto:</span>
        <span id="balance-neto" class="text-lg font-bold text-blue-400">$0.00</span>
      </div>
    </section>

    <section class="grid grid-cols-2 gap-3">
      <button onclick="mostrarForm('venta-prod')" class="bg-blue-600 hover:bg-blue-500 p-3 rounded-xl font-semibold text-sm shadow flex flex-col items-center gap-1">
        <span>📦 Nueva Venta Prod.</span>
      </button>
      <button onclick="mostrarForm('venta-libre')" class="bg-cyan-600 hover:bg-cyan-500 p-3 rounded-xl font-semibold text-sm shadow flex flex-col items-center gap-1">
        <span>⚡ Venta Libre</span>
      </button>
      <button onclick="mostrarForm('gasto')" class="bg-rose-600 hover:bg-rose-500 p-3 rounded-xl font-semibold text-sm shadow flex flex-col items-center gap-1">
        <span>💸 Registrar Gasto</span>
      </button>
      <button onclick="mostrarForm('producto')" class="bg-amber-600 hover:bg-amber-500 p-3 rounded-xl font-semibold text-sm shadow flex flex-col items-center gap-1">
        <span>🏷️ Nuevo Producto</span>
      </button>
    </section>

    <section id="form-container" class="hidden bg-slate-800 p-4 rounded-xl border border-slate-700 relative shadow-xl">
      <button onclick="ocultarForm()" class="absolute top-3 right-3 text-slate-400 hover:text-white">✕</button>
      
      <form id="form-venta-prod" class="space-y-3 hidden">
        <h3 class="font-bold text-blue-400 text-sm">Registrar Venta de Producto</h3>
        <input type="datetime-local" id="vp-fecha" class="w-full bg-slate-700 p-2 rounded text-sm text-white">
        <select id="vp-cliente" class="w-full bg-slate-700 p-2 rounded text-sm text-white"><option>Seleccionar Cliente</option></select>
        <select id="vp-producto" class="w-full bg-slate-700 p-2 rounded text-sm text-white"><option>Seleccionar Producto</option></select>
        <input type="number" id="vp-descuento" placeholder="Descuento ($)" class="w-full bg-slate-700 p-2 rounded text-sm text-white">
        <div class="flex items-center gap-2">
          <input type="checkbox" id="vp-es-deuda" onchange="toggleAbono('vp')">
          <label for="vp-es-deuda" class="text-sm">¿Es Venta a Crédito / Deuda?</label>
        </div>
        <input type="number" id="vp-abono" placeholder="Monto de Abono Inicial" class="w-full bg-slate-700 p-2 rounded text-sm text-white hidden">
        <textarea id="vp-detalles" placeholder="Detalles u observaciones..." class="w-full bg-slate-700 p-2 rounded text-sm text-white"></textarea>
        <button type="button" onclick="guardarVentaProducto()" class="w-full bg-blue-600 py-2 rounded font-bold text-sm">Guardar Venta</button>
      </form>

      <form id="form-venta-libre" class="space-y-3 hidden">
        <h3 class="font-bold text-cyan-400 text-sm">Registrar Venta Libre</h3>
        <input type="datetime-local" id="vl-fecha" class="w-full bg-slate-700 p-2 rounded text-sm text-white">
        <select id="vl-cliente" class="w-full bg-slate-700 p-2 rounded text-sm text-white"><option>Seleccionar Cliente</option></select>
        <input type="number" id="vl-valor" placeholder="Valor de Venta ($)" class="w-full bg-slate-700 p-2 rounded text-sm text-white">
        <input type="number" id="vl-descuento" placeholder="Descuento ($)" class="w-full bg-slate-700 p-2 rounded text-sm text-white">
        <div class="flex items-center gap-2">
          <input type="checkbox" id="vl-es-deuda" onchange="toggleAbono('vl')">
          <label for="vl-es-deuda" class="text-sm">¿Es a Crédito / Deuda?</label>
        </div>
        <input type="number" id="vl-abono" placeholder="Abono Inicial" class="w-full bg-slate-700 p-2 rounded text-sm text-white hidden">
        <textarea id="vl-detalles" placeholder="Detalles de la venta..." class="w-full bg-slate-700 p-2 rounded text-sm text-white"></textarea>
        <button type="button" onclick="guardarVentaLibre()" class="w-full bg-cyan-600 py-2 rounded font-bold text-sm">Guardar Venta Libre</button>
      </form>

      <form id="form-gasto" class="space-y-3 hidden">
        <h3 class="font-bold text-rose-400 text-sm">Registrar Gasto</h3>
        <input type="datetime-local" id="g-fecha" class="w-full bg-slate-700 p-2 rounded text-sm text-white">
        <select id="g-proveedor" class="w-full bg-slate-700 p-2 rounded text-sm text-white"><option>Seleccionar Proveedor</option></select>
        <input type="number" id="g-valor" placeholder="Valor del Gasto ($)" class="w-full bg-slate-700 p-2 rounded text-sm text-white">
        <div class="flex items-center gap-2">
          <input type="checkbox" id="g-es-deuda" onchange="toggleAbono('g')">
          <label for="g-es-deuda" class="text-sm">¿Queda como Deuda por Pagar?</label>
        </div>
        <input type="number" id="g-abono" placeholder="Abono Realizado" class="w-full bg-slate-700 p-2 rounded text-sm text-white hidden">
        <textarea id="g-detalles" placeholder="Detalles del gasto..." class="w-full bg-slate-700 p-2 rounded text-sm text-white"></textarea>
        <button type="button" onclick="guardarGasto()" class="w-full bg-rose-600 py-2 rounded font-bold text-sm">Guardar Gasto</button>
      </form>

      <form id="form-producto" class="space-y-3 hidden">
        <h3 class="font-bold text-amber-400 text-sm">Crear Nuevo Producto</h3>
        <input type="text" id="p-nombre" placeholder="Nombre del Producto" class="w-full bg-slate-700 p-2 rounded text-sm text-white">
        <div class="grid grid-cols-2 gap-2">
          <input type="number" id="p-compra" placeholder="P. Compra ($)" class="bg-slate-700 p-2 rounded text-sm text-white">
          <input type="number" id="p-venta" placeholder="P. Venta ($)" class="bg-slate-700 p-2 rounded text-sm text-white">
        </div>
        <input type="number" id="p-stock" placeholder="Cantidad Inicial" class="w-full bg-slate-700 p-2 rounded text-sm text-white">
        <input type="file" id="p-imagen" accept="image/*" class="w-full bg-slate-700 p-2 rounded text-sm text-slate-300">
        <button type="button" onclick="guardarProducto()" class="w-full bg-amber-600 py-2 rounded font-bold text-sm">Crear Producto</button>
      </form>
    </section>

    <section class="grid grid-cols-2 gap-3">
      <div class="bg-slate-800 p-3 rounded-xl border border-slate-700">
        <h3 class="text-xs font-semibold text-amber-400 mb-1">Deudas por Cobrar</h3>
        <p id="deudas-cobrar" class="text-lg font-bold text-slate-200">$0.00</p>
      </div>
      <div class="bg-slate-800 p-3 rounded-xl border border-slate-700">
        <h3 class="text-xs font-semibold text-purple-400 mb-1">Deudas por Pagar</h3>
        <p id="deudas-pagar" class="text-lg font-bold text-slate-200">$0.00</p>
      </div>
    </section>

  </main>

  <nav class="fixed bottom-0 w-full bg-slate-800 border-t border-slate-700 flex justify-around p-2 text-xs text-slate-400">
    <button class="flex flex-col items-center text-blue-400">
      <span>📊</span>
      <span>Inicio</span>
    </button>
    <button class="flex flex-col items-center">
      <span>👥</span>
      <span>Clientes</span>
    </button>
    <button class="flex flex-col items-center">
      <span>🚚</span>
      <span>Proveedores</span>
    </button>
    <button class="flex flex-col items-center">
      <span>📦</span>
      <span>Inventario</span>
    </button>
  </nav>

  <script>
    // Registro del Service Worker para PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    function mostrarForm(tipo) {
      document.getElementById('form-container').classList.remove('hidden');
      ['venta-prod', 'venta-libre', 'gasto', 'producto'].forEach(f => {
        document.getElementById(`form-${f}`).classList.add('hidden');
      });
      document.getElementById(`form-${tipo}`).classList.remove('hidden');
    }

    function ocultarForm() {
      document.getElementById('form-container').classList.add('hidden');
    }

    function toggleAbono(prefix) {
      const check = document.getElementById(`${prefix}-es-deuda`);
      const inputAbono = document.getElementById(`${prefix}-abono`);
      if (check.checked) {
        inputAbono.classList.remove('hidden');
      } else {
        inputAbono.classList.add('hidden');
      }
    }
  </script>

  <script>
  // 1. INICIALIZAR SUPABASE
  const { createClient } = supabase;
  const supabaseUrl = 'https://jmidlrztyzzmauroxuuf.supabase.co/rest/v1/';
  const supabaseKey = 'sb_publishable_7rrvQ2yvzVaiYLEqtgoa_w_GbrCRoAi';
  const db = createClient(supabaseUrl, supabaseKey);

  // Ejemplo de función para guardar un cliente en la base de datos
  async function guardarCliente(nombre, telefono) {
    const { data, error } = await db
      .from('clientes')
      .insert([{ nombre: nombre, telefono: telefono }]);
    
    if (error) {
      alert('Error al guardar: ' + error.message);
    } else {
      alert('Cliente guardado con éxito');
    }
  }

  // Ejemplo de función para consultar el Balance de Ingresos
  async function cargarIngresos() {
    const { data, error } = await db
      .from('ventas')
      .select('monto_final');
    
    if (!error) {
      const total = data.reduce((sum, venta) => sum + venta.monto_final, 0);
      document.getElementById('total-ingresos').innerText = `$${total.toFixed(2)}`;
    }
  }

  // Cargar datos al iniciar la app
  window.onload = () => {
    cargarIngresos();
  };
</script>

</body>
</html>
